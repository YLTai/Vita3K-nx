# Single-NRO memory validation. Copy as sdmc:/switch/vita3k/tracelab.cfg
# Defaults are identical; this preset also overrides an old mode=off file.
mode=auto
memory_validation=auto
validation_warmup_seconds=120
validation_settle_seconds=3
validation_phase_seconds=20
legacy_csv=off
guest_write_probe=off
texture_hash_probe_interval=0
unsafe_texture_hash_skip_interval=0
unsafe_texture_hash_recheck_interval=0
