# One actual-game audit. Old heap_fault presets follow this build's default.
mode=auto
memory_validation=on
validation_experiment=epoch_audit
# Enter target gameplay, L+R+Y once: 1s settle + 6s measure, ABBA = 28s.
# Full ordinary texture Hash remains authoritative; zero mismatches is not proof.
# Direct Heap and deferred whole GPU imports remain unchanged.
guest_backing=direct_heap
gpu_import=deferred
# Explicit developer-only old private suite: validation_experiment=legacy_heap_fault
